<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maddison Windfarm Enquiries</title>
  <link rel="stylesheet" href="enquiries_style.css">
</head>
<body>
  <main class="page">
    <div class="form-shell">
      <h1>Maddison Windfarm Enquiries</h1>
      <p class="intro">
        Please complete the enquiry form below. A member of the relevant department will review your submission.
      </p>

      <form id="enquiry-form" action="https://api.staticforms.dev/submit" method="POST">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="region">Region</label>
        <select id="region" name="region" required>
          <option value="">Select region</option>
          <option value="Hamilton">Hamilton</option>
          <option value="north-hill">North Hill</option>
          <option value="maddison">Maddison</option>
          <option value="bridgewater">Bridgewater</option>
        </select>

        <label for="turbine">Turbine Number</label>
        <select id="turbine" name="turbine" required>
          <option value="">Select turbine</option>
          <option value="01">MX01</option>
          <option value="02">MX02</option>
          <option value="03">MX03</option>
          <option value="04">MX04</option>
          <option value="05">MX05</option>
          <option value="06">MX06</option>
          <option value="07">MX07</option>
        </select>
        
        <label for="message">Additional Information</label>
        <textarea id="message" name="message" rows="6" placeholder="Enter details here..."></textarea>

        <input type="hidden" name="apiKey" value="sf_7f9c350202c352640a10eebd">

        <input type="hidden" name="subject" id="subject" value="Maddison Windfarm Enquiry Submission">
        <input type="hidden" name="result" id="result" value="incorrect">

        <div class="hp-field" aria-hidden="true">
          <label for="honeypot">Leave this field empty</label>
          <input type="text" id="honeypot" name="honeypot" tabindex="-1" autocomplete="off">
        </div>


        <button type="submit">Submit Enquiry</button>
      </form>

      <p class="footnote">
        Reference submissions are reviewed manually.
      </p>
    </div>
  </main>

 <script>
  document.getElementById("enquiry-form").addEventListener("submit", function () {
    const region = document.getElementById("region").value;
    const turbine = document.getElementById("turbine").value;
    const resultField = document.getElementById("result");
    const subjectField = document.getElementById("subject");

    if (region === "north-hill" && turbine === "04") {
      resultField.value = "correct";
      subjectField.value = "Maddison Windfarm Enquiry Submission - CORRECT";
    } else {
      resultField.value = "incorrect";
      subjectField.value = "Maddison Windfarm Enquiry Submission - INCORRECT";
    }
  });
</script>
</body>
</html>
